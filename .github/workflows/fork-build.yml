name: Fork Windows build
on:
  push:
    branches: [codex/ad-free-book-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    if: github.repository == 'songjoon/sumatrapdf'
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Build Windows release
        run: bun cmd/build.ts -rel
      - name: Check book page navigation
        shell: pwsh
        env:
          SUMATRA_TEST_EXE: ${{ github.workspace }}\out\rel64\SumatraPDF.exe
        run: |
          if (Test-Path tests/ad-hoc-book-pages.ts) {
            bun tests/ad-hoc-book-pages.ts --no-build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SumatraPDF-fork-windows-x64
          path: |
            out/rel64/*.exe
            out/rel64/*.dll
            out/rel64/*.pdb
          retention-days: 7
          if-no-files-found: error
